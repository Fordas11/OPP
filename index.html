<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonebound</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="game-frame" aria-label="Bonebound game">
        <canvas id="game" width="960" height="600" aria-label="A knight fighting skeletons"></canvas>
        <div id="startScreen" class="overlay menu-overlay">
          <h1>Dungeon Crawler</h1>
          <div class="menu-actions">
            <button id="startButton">Start Game</button>
            <button id="menuSettingsButton" class="secondary-menu-button">Settings</button>
          </div>
        </div>
        <div id="pauseScreen" class="overlay hidden">
          <h2>Paused</h2>
          <div class="menu-actions">
            <button id="pauseSettingsButton" class="secondary-menu-button">Settings</button>
            <button id="restartButton" class="secondary-menu-button">Restart</button>
            <button id="pauseMainMenuButton" class="secondary-menu-button">Main Menu</button>
          </div>
        </div>
        <div id="gameOver" class="overlay hidden">
          <h1>FALLEN</h1>
          <p id="finalLevel"></p>
          <button id="retryButton">Restart</button>
        </div>
      </section>
    </main>
    <div id="settingsPanel" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-card">
        <div class="settings-heading"><div><p class="eyebrow">Dungeon options</p><h2 id="settingsTitle">Settings</h2></div><button id="closeSettings" class="close-button" aria-label="Close settings">×</button></div>
        <section class="settings-section">
          <h3>Keybinds</h3>
          <div class="binding-grid">
            <span>Move up</span><button class="binding-button" data-bind="up"></button>
            <span>Move down</span><button class="binding-button" data-bind="down"></button>
            <span>Move left</span><button class="binding-button" data-bind="left"></button>
            <span>Move right</span><button class="binding-button" data-bind="right"></button>
            <span>Attack</span><button class="binding-button" data-bind="attack"></button>
          </div>
          <p id="bindingHint" class="setting-hint">Select a binding, then press a key. Attack can also use a mouse button.</p>
        </section>
        <section class="settings-section">
          <h3>Difficulty</h3>
          <div id="difficultyOptions" class="difficulty-options">
            <button data-difficulty="calm"><strong>Calm</strong><small>Short sight · 1 damage</small></button>
            <button data-difficulty="standard"><strong>Standard</strong><small>Medium sight · 1 damage</small></button>
            <button data-difficulty="brutal"><strong>Brutal</strong><small>Long sight · 2 damage</small></button>
          </div>
        </section>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
